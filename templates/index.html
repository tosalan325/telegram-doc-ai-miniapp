<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DocCheck AI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Наши стили -->
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="badge">AI Document Checker</div>

            <h1>Проверка документа</h1>

            <p>
                Загрузите договор, PDF, фото или скан — AI поможет быстро понять главное.
            </p>
        </header>

        <main class="card">
            <section class="upload-section">
                <label class="file-label" for="fileInput">
                    <span class="file-icon">📄</span>
                    <span class="file-title">Выбрать документ</span>
                    <span class="file-subtitle">
                        PDF, DOCX, TXT, JPG, PNG, WEBP
                    </span>
                </label>

                <input
                    id="fileInput"
                    type="file"
                    accept=".pdf,.docx,.txt,.jpg,.jpeg,.png,.webp"
                >

                <div id="fileName" class="file-name">
                    Файл не выбран
                </div>

                <div id="analysisPanel" class="analysis-panel">
                    <div class="analysis-title">
                        Что хотите узнать?
                    </div>

                    <div class="analysis-grid">
                        <button class="analysis-button active" data-type="full">
                            🧾 Полный<br>анализ
                        </button>

                        <button class="analysis-button" data-type="summary">
                            📄 Краткое<br>резюме
                        </button>

                        <button class="analysis-button" data-type="strengths">
                            ✅ Сильные<br>стороны
                        </button>

                        <button class="analysis-button" data-type="weaknesses">
                            ⚠️ Слабые<br>стороны
                        </button>

                        <button class="analysis-button" data-type="risks">
                            ❗ Риски<br>документа
                        </button>

                        <button class="analysis-button" data-type="dates">
                            📅 Даты<br>и сроки
                        </button>

                        <button class="analysis-button" data-type="money">
                            💰 Деньги<br>и суммы
                        </button>

                        <button class="analysis-button" data-type="parties">
                            👥 Стороны<br>документа
                        </button>

                        <button class="analysis-button" data-type="attention">
                            🔍 Важные<br>пункты
                        </button>

                        <button class="analysis-button" data-type="simple">
                            🧠 Простыми<br>словами
                        </button>

                        <button class="analysis-button" data-type="fixes">
                            ✍️ Что<br>исправить
                        </button>

                        <button class="analysis-button" data-type="questions">
                            ❓ Вопросы<br>стороне
                        </button>

                        <button class="analysis-button" data-type="dangerous">
                            🟥 Опасные<br>фразы
                        </button>

                        <button class="analysis-button" data-type="score">
                            📊 Оценка<br>документа
                        </button>
                    </div>
                </div>

                <button id="analyzeButton" class="button" disabled>
                    Сначала выберите документ
                </button>
            </section>

            <section id="statusBox" class="status hidden">
                <div class="loader"></div>
                <span id="statusText">Обрабатываю документ...</span>
            </section>

            <section id="errorBox" class="error hidden"></section>

            <section id="resultBox" class="result hidden">
                <div class="result-header">
                    <h2>Результат</h2>

                    <button id="copyButton" class="copy-button" type="button">
                        📋 Скопировать
                    </button>
                </div>

                <div id="resultText"></div>
            </section>
        </main>

        <footer class="footer">
            <p>
                Это не юридическая консультация. Для важных сделок лучше обратиться к специалисту.
            </p>
        </footer>
    </div>

    <script src="/static/app.js?v=4"></script>
</body>
</html>
